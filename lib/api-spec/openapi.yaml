openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Business Jarvis API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: businesses
    description: Business management
  - name: reports
    description: Business reports
  - name: managers
    description: Manager operations
  - name: dashboard
    description: Dashboard and aggregates
  - name: ai
    description: AI summaries
  - name: events
    description: Event feed
  - name: feed
    description: Morning feed items
  - name: voice
    description: Voice transcription
  - name: notes
    description: Personal notes (owner only)
  - name: tasks
    description: Task management and activity journal

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List all businesses
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Register a new business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /businesses/card:
    get:
      operationId: getBusinessCard
      tags: [businesses]
      summary: Get full company card aggregate (plan-fact, roadmap, coverage, management, latest report)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full business card aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessCard"
        "404":
          description: Business not found

  /businesses/{id}:
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: Get business by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Update business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: Get reports for a business
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: integer
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a report for a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/latest:
    get:
      operationId: fetchLatestReport
      tags: [reports]
      summary: Get latest report for a business
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: integer
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
      responses:
        "200":
          description: Latest report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: No report found

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get global dashboard stats across all businesses
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
      responses:
        "200":
          description: Global stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/top-businesses:
    get:
      operationId: getTopBusinesses
      tags: [dashboard]
      summary: Get top businesses by revenue for a period
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Top businesses with their latest metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessMetric"

  /ai/summary:
    get:
      operationId: getAiSummary
      tags: [ai]
      summary: Get AI-generated summary across all businesses
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
      responses:
        "200":
          description: AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSummary"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with AI about your businesses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: AI chat reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatReply"

  /managers/connect:
    post:
      operationId: connectBusiness
      tags: [managers]
      summary: Manager connects their business to the platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectInput"
      responses:
        "201":
          description: Business connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List active (non-dismissed) events sorted by severity
      responses:
        "200":
          description: List of active events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/dismiss-all:
    post:
      operationId: dismissAllEvents
      tags: [events]
      summary: Dismiss all active events
      responses:
        "200":
          description: All events dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DismissResult"

  /people:
    get:
      operationId: listPeople
      tags: [tasks]
      summary: List all people (inner circle)
      responses:
        "200":
          description: List of people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"

  /tasks/draft:
    post:
      operationId: draftTask
      tags: [tasks]
      summary: Parse free text into a task draft via AI (does not save)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDraftInput"
      responses:
        "200":
          description: Task draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDraft"

  /tasks/tree:
    get:
      operationId: getTaskTree
      tags: [tasks]
      summary: Get a task and all its direct subtasks (by parentId, depth-first)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task distribution tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTree"
        "400":
          description: Bad request
        "404":
          description: Not found

  /tasks/activity:
    get:
      operationId: getTaskActivity
      tags: [tasks]
      summary: Get activity journal for a task
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskActivity"
        "400":
          description: Bad request

  /tasks/start:
    post:
      operationId: startTask
      tags: [tasks]
      summary: Accept task into work — transitions sent → in_progress
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found

  /tasks/submit:
    post:
      operationId: submitTask
      tags: [tasks]
      summary: Submit task for review — transitions in_progress → review
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTaskInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found

  /tasks/accept:
    post:
      operationId: acceptTask
      tags: [tasks]
      summary: Accept a review task — marks it done
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found

  /tasks/return:
    post:
      operationId: returnTask
      tags: [tasks]
      summary: Return a task to the assignee with a comment
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnTaskInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks with assignee info
      parameters:
        - name: box
          in: query
          required: false
          schema:
            type: string
            enum: [active, review]
        - name: assigneeId
          in: query
          required: false
          schema:
            type: integer
        - name: createdByPersonId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Save a confirmed task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /events/{id}/dismiss:
    patch:
      operationId: dismissEvent
      tags: [events]
      summary: Dismiss a single event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found

  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get active news feed items (status=new OR snoozed+expired)
      parameters:
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [critical, attention, info]
        - name: includeExternal
          in: query
          required: false
          schema:
            type: boolean
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [owner, director, employee]
      responses:
        "200":
          description: List of active news items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"

  /feed/seen:
    post:
      operationId: markFeedSeen
      tags: [feed]
      summary: Mark a news feed item as seen (done)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DismissResult"

  /feed/snooze:
    post:
      operationId: snoozeFeedItem
      tags: [feed]
      summary: Snooze a news feed item for N hours
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Snoozed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DismissResult"

  /feed/items:
    get:
      operationId: getFeedItems
      tags: [feed]
      summary: Get pending morning feed items sorted by severity
      responses:
        "200":
          description: List of pending feed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedItem"

  /feed/items/{id}/dismiss:
    patch:
      operationId: dismissFeedItem
      tags: [feed]
      summary: Dismiss a feed item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DismissResult"

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List all notes (pinned first, newest first)
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a new note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/patch:
    post:
      operationId: updateNote
      tags: [notes]
      summary: Update a note (body, pinned, aiSummary)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotePatch"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found

  /notes/delete:
    post:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDeleteResult"
        "404":
          description: Not found

  /notes/expand:
    post:
      operationId: expandNote
      tags: [notes]
      summary: AI-expand a note in the chosen mode (develop/steps/risks/route/summarize)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteExpandInput"
      responses:
        "200":
          description: Expanded markdown text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteExpandResult"
        "404":
          description: Note not found

  /voice/transcribe:
    post:
      operationId: voiceTranscribe
      tags: [voice]
      summary: Transcribe base64-encoded audio to text (max ~60 s, Russian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceTranscribeInput"
      responses:
        "200":
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceTranscribeResult"

  /feed/draft-task:
    post:
      operationId: feedDraftTask
      tags: [feed]
      summary: Generate AI task draft from feed item context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedDraftInput"
      responses:
        "200":
          description: Task draft with business context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedDraft"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Business:
      type: object
      required: [id, name, city, country, lat, lng, industry, status, health, currency, managerId, managerName, managerEmail, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
        industry:
          type: string
        status:
          type: string
          enum: [active, inactive, pending]
        health:
          type: string
          enum: [green, yellow, red]
        currency:
          type: string
        managerId:
          type: integer
        managerName:
          type: string
        managerEmail:
          type: string
        createdAt:
          type: string
        description:
          type: ["string", "null"]
        analytics:
          type: ["object", "null"]
          additionalProperties: true

    BusinessInput:
      type: object
      required: [name, city, country, lat, lng, industry, managerName, managerEmail]
      properties:
        name:
          type: string
        city:
          type: string
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
        industry:
          type: string
        managerName:
          type: string
        managerEmail:
          type: string
        description:
          type: string
        currency:
          type: string

    BusinessUpdate:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
        industry:
          type: string
        status:
          type: string
          enum: [active, inactive, pending]
        description:
          type: string

    Report:
      type: object
      required: [id, businessId, period, revenue, orders, profit, date]
      properties:
        id:
          type: integer
        businessId:
          type: integer
        period:
          type: string
          enum: [day, week, month]
        revenue:
          type: number
        orders:
          type: integer
        profit:
          type: number
        date:
          type: string
        notes:
          type: ["string", "null"]

    ReportInput:
      type: object
      required: [businessId, period, revenue, orders, profit, date]
      properties:
        businessId:
          type: integer
        period:
          type: string
          enum: [day, week, month]
        revenue:
          type: number
        orders:
          type: integer
        profit:
          type: number
        date:
          type: string
        notes:
          type: string

    DashboardStats:
      type: object
      required: [totalRevenue, totalOrders, totalProfit, activeBusinesses, totalBusinesses, period]
      properties:
        totalRevenue:
          type: number
        totalOrders:
          type: integer
        totalProfit:
          type: number
        activeBusinesses:
          type: integer
        totalBusinesses:
          type: integer
        period:
          type: string

    BusinessMetric:
      type: object
      required: [id, name, city, country, lat, lng, industry, revenue, orders, profit, currency]
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
        industry:
          type: string
        revenue:
          type: number
        orders:
          type: integer
        profit:
          type: number
        currency:
          type: string

    AiSummary:
      type: object
      required: [period, summary, highlights, generatedAt]
      properties:
        period:
          type: string
        summary:
          type: string
        highlights:
          type: array
          items:
            type: string
        generatedAt:
          type: string

    AiChatInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        history:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string

    AiChatReply:
      type: object
      required: [reply, timestamp]
      properties:
        reply:
          type: string
        timestamp:
          type: string

    ConnectInput:
      type: object
      required: [name, city, country, lat, lng, industry, managerName, managerEmail, accessCode]
      properties:
        name:
          type: string
        city:
          type: string
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
        industry:
          type: string
        managerName:
          type: string
        managerEmail:
          type: string
        accessCode:
          type: string
        description:
          type: string

    Event:
      type: object
      required: [id, text, severity, occurredAt]
      properties:
        id:
          type: integer
        businessId:
          type: ["integer", "null"]
        businessName:
          type: ["string", "null"]
        text:
          type: string
        severity:
          type: string
          enum: [critical, warning, info]
        occurredAt:
          type: string
        dismissedAt:
          type: ["string", "null"]

    DismissResult:
      type: object
      required: [dismissed]
      properties:
        dismissed:
          type: integer

    Person:
      type: object
      required: [id, name, role, isInnerCircle, isAssistant]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        groupLabel:
          type: ["string", "null"]
        isInnerCircle:
          type: boolean
        isAssistant:
          type: boolean
        email:
          type: ["string", "null"]

    Task:
      type: object
      required: [id, title, body, assigneeId, assigneeName, assigneeRole, watchers, priority, status, createdAt, lastActivityAt]
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        assigneeId:
          type: integer
        assigneeName:
          type: string
        assigneeRole:
          type: string
        watchers:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        priority:
          type: string
          enum: [high, medium, low]
        dueDate:
          type: ["string", "null"]
        businessId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [draft, sent, in_progress, review, done, returned]
        createdBy:
          type: string
        createdByPersonId:
          type: ["integer", "null"]
        parentId:
          type: ["integer", "null"]
        returnComment:
