[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/api-server run build"]

[start]
cmd = "pnpm --filter @workspace/db run push && pnpm --filter @workspace/scripts run seed:all && PORT=${PORT:-8080} pnpm --filter @workspace/api-server run start"
