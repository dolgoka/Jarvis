[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@latest --activate", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/business-jarvis run build"]

[start]
cmd = "npx serve -s artifacts/business-jarvis/dist/public -l $PORT"
